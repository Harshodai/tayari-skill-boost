services:
  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be an immutable image digest}
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-ai:
    image: ${PYTHON_API_IMAGE:?PYTHON_API_IMAGE must be an immutable image digest}
    environment:
      ENV: production
      UVICORN_RELOAD: "false"
      UVICORN_WORKERS: "1"
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?APPROVAL_SIGNING_KEY is required}
      TAYARI_API_KEY: ${TAYARI_API_KEY:?TAYARI_API_KEY is required}
      AUTONOMOUS_SUBMIT_ENABLED: "false"
      # Internal Compose DNS name for the Go gateway, read by
      # submission_receipt.py's debit_submission_credit() to call back into
      # Go's billing endpoint. Without this it falls back to
      # http://127.0.0.1:8080, which is wrong inside a container.
      GO_BACKEND_URL: http://go-backend:8080
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-}
      NOTIFICATIONS_UNSUBSCRIBE_URL: ${NOTIFICATIONS_UNSUBSCRIBE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  celery-worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be an immutable image digest}
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "tayari"]
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?APPROVAL_SIGNING_KEY is required}
      TAYARI_API_KEY: ${TAYARI_API_KEY:?TAYARI_API_KEY is required}
      AUTONOMOUS_SUBMIT_ENABLED: "false"
      # See python-ai's environment block above for why this is required.
      GO_BACKEND_URL: http://go-backend:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-}
      NOTIFICATIONS_UNSUBSCRIBE_URL: ${NOTIFICATIONS_UNSUBSCRIBE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-backend:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE must be an immutable image digest}
    environment:
      ENV: production
      APP_ENV: production
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AI_SERVICE_URL: http://python-ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?APPROVAL_SIGNING_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      USE_SUPABASE: "true"
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      FRONTEND_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      APP_VERSION: ${APP_VERSION:-aws-canary}
      WHATSAPP_GRAPH_API_BASE_URL: ${WHATSAPP_GRAPH_API_BASE_URL:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APPROVAL_TEMPLATE_NAME: ${WHATSAPP_APPROVAL_TEMPLATE_NAME:-}
      WHATSAPP_LINK_TEMPLATE_NAME: ${WHATSAPP_LINK_TEMPLATE_NAME:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      CAPABILITY_WORKSPACE_NOTIFICATION_WHATSAPP: ${CAPABILITY_WORKSPACE_NOTIFICATION_WHATSAPP:-false}
      CAPABILITY_WORKSPACE_APPROVALS: ${CAPABILITY_WORKSPACE_APPROVALS:-false}
    depends_on:
      python-ai:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable image digest}
    depends_on:
      go-backend:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE must be an immutable image digest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required}
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      go-backend:
        condition: service_healthy

volumes:
  redis_data:
  caddy_data:
  caddy_config:
