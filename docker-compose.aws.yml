services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-ai:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    environment:
      ENV: production
      UVICORN_RELOAD: "false"
      UVICORN_WORKERS: "1"
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?APPROVAL_SIGNING_KEY is required}
      TAYARI_API_KEY: ${TAYARI_API_KEY:?TAYARI_API_KEY is required}
      AUTONOMOUS_SUBMIT_ENABLED: "false"
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-}
      NOTIFICATIONS_UNSUBSCRIBE_URL: ${NOTIFICATIONS_UNSUBSCRIBE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  celery-worker:
    build:
      context: ./backend/python
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "tayari"]
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?APPROVAL_SIGNING_KEY is required}
      TAYARI_API_KEY: ${TAYARI_API_KEY:?TAYARI_API_KEY is required}
      AUTONOMOUS_SUBMIT_ENABLED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-}
      NOTIFICATIONS_UNSUBSCRIBE_URL: ${NOTIFICATIONS_UNSUBSCRIBE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-backend:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AI_SERVICE_URL: http://python-ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?APPROVAL_SIGNING_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      USE_SUPABASE: "true"
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      FRONTEND_URL: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      APP_VERSION: ${APP_VERSION:-aws-canary}
    depends_on:
      python-ai:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
        VITE_USE_SELF_HOSTED: "false"
        VITE_SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
        VITE_SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID:-}
        VITE_SENTRY_DSN: ${SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: production
    depends_on:
      go-backend:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required}
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      go-backend:
        condition: service_healthy

volumes:
  redis_data:
  caddy_data:
  caddy_config:
