directories:
  output: release
appId: app.tayari.desktop
productName: Job Tayari Desktop
icon: build/icon.png
copyright: Copyright © 2026 Job Tayari
artifactName: ${productName}-${version}-${arch}.${ext}
asar: true
compression: maximum
files:
  - dist/**
  - electron/**
  - package.json
  - '!**/*.map'
  - '!electron/**/*.test.cjs'
  - '!electron/*.plist'
extraMetadata:
  version: 0.1.0
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: true
  strictVerify: true
  entitlements: electron/entitlements.plist
  entitlementsInherit: electron/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Tayari uses the microphone only when you start a voice-coaching session.
  # Public release overrides this with --config.mac.notarize=true and supplies APPLE_TEAM_ID plus Apple notarization credentials from the runner environment.

  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  title: Job Tayari Desktop
  sign: true
win:
  target:
    - nsis
    - portable
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  category: Utility
  synopsis: Job search operations workspace
  description: A desktop workspace for deliberate, reviewable job search operations.
  target:
    - AppImage
    - deb
extraResources:
  - from: native-host/bin/${os}-${arch}
    to: native-host
  - from: native-host/installers
    to: native-host/installers
