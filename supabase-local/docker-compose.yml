# Minimal Supabase Setup for Local Development
# Removes: analytics, vector, imgproxy, edge-functions
# This reduces RAM usage from ~4GB to ~2GB

name: tayari-supabase

services:

  studio:
    container_name: supabase-studio
    image: supabase/studio:2026.01.27-sha-6aa59ff
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://studio:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
        ]
      timeout: 10s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${SUPABASE_STUDIO_PORT:-3001}:3000
    environment:
      HOSTNAME: "::"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      # Disable analytics for minimal setup
      NEXT_PUBLIC_ENABLE_LOGS: false

  kong:
    container_name: supabase-kong
    image: kong:2.8.1
    restart: unless-stopped
    ports:
      - ${KONG_HTTP_PORT}:8000/tcp
      - ${KONG_HTTPS_PORT}:8443/tcp
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro,z
    depends_on:
      db:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'

  auth:
    container_name: supabase-auth
    image: supabase/gotrue:v2.185.0
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}

  rest:
    container_name: supabase-rest
    image: postgrest/postgrest:v14.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgrest"
      ]

  realtime:
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.72.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  storage:
    container_name: supabase-storage
    image: supabase/storage-api:v1.33.5
    restart: unless-stopped
    volumes:
      - ./volumes/storage:/var/lib/storage:z
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://storage:5000/status"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      # Disable image transformation (no imgproxy)
      ENABLE_IMAGE_TRANSFORMATION: "false"

  meta:
    container_name: supabase-meta
    image: supabase/postgres-meta:v0.95.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  db:
    container_name: supabase-db
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      - ./volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      - ./volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      - ./volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      # Custom Tayari schema. migrate.sh globs migrations/*.sql non-recursively
      # (see /docker-entrypoint-initdb.d/migrate.sh in the image) -- a
      # subdirectory mount here is silently invisible to it, so each file is
      # mounted individually, same as the realtime/webhooks/roles/jwt lines
      # above. "zz-" makes these sort after every baked-in migration
      # (dbmate-style timestamp prefixes, e.g. 20250417190610_*) so
      # auth.users/storage schemas and the anon/authenticated/service_role
      # roles already exist before our tables' FKs and grants run.
      - ./volumes/db/init/00-init-schema.sql:/docker-entrypoint-initdb.d/migrations/zz-00-init-schema.sql:Z
      - ./volumes/db/init/01-mvp-additions.sql:/docker-entrypoint-initdb.d/migrations/zz-01-mvp-additions.sql:Z
      - ./volumes/db/init/02-20250120_week3_4_review_queue.sql:/docker-entrypoint-initdb.d/migrations/zz-02-20250120_week3_4_review_queue.sql:Z
      - ./volumes/db/init/03-20260620_hermes_agents.sql:/docker-entrypoint-initdb.d/migrations/zz-03-20260620_hermes_agents.sql:Z
      - ./volumes/db/init/04-20260625_archive_integration.sql:/docker-entrypoint-initdb.d/migrations/zz-04-20260625_archive_integration.sql:Z
      - ./volumes/db/init/05-20260625_career_intelligence.sql:/docker-entrypoint-initdb.d/migrations/zz-05-20260625_career_intelligence.sql:Z
      - ./volumes/db/init/06-20260625_voice_interview.sql:/docker-entrypoint-initdb.d/migrations/zz-06-20260625_voice_interview.sql:Z
      - ./volumes/db/init/07-20260626_api_keys.sql:/docker-entrypoint-initdb.d/migrations/zz-07-20260626_api_keys.sql:Z
      - ./volumes/db/init/08-20260626_multi_tenant.sql:/docker-entrypoint-initdb.d/migrations/zz-08-20260626_multi_tenant.sql:Z
      - ./volumes/db/init/09-20260626_password_reset.sql:/docker-entrypoint-initdb.d/migrations/zz-09-20260626_password_reset.sql:Z
      - ./volumes/db/init/10-20260626_predictive_analytics.sql:/docker-entrypoint-initdb.d/migrations/zz-10-20260626_predictive_analytics.sql:Z
      - ./volumes/db/init/11-20260627_agent_space_integration.sql:/docker-entrypoint-initdb.d/migrations/zz-11-20260627_agent_space_integration.sql:Z
      - ./volumes/db/init/12-20260628_agentspace_events_and_tasks.sql:/docker-entrypoint-initdb.d/migrations/zz-12-20260628_agentspace_events_and_tasks.sql:Z
      - ./volumes/db/init/13-20260629_full_career_ops_command_center.sql:/docker-entrypoint-initdb.d/migrations/zz-13-20260629_full_career_ops_command_center.sql:Z
      - ./volumes/db/init/14-20260630_communications_response_tracking.sql:/docker-entrypoint-initdb.d/migrations/zz-14-20260630_communications_response_tracking.sql:Z
      - ./volumes/db/init/15-20260701_add_resume_graph_table.sql:/docker-entrypoint-initdb.d/migrations/zz-15-20260701_add_resume_graph_table.sql:Z
      - ./volumes/db/init/16-20260731_social_privacy_preferences.sql:/docker-entrypoint-initdb.d/migrations/zz-16-20260731_social_privacy_preferences.sql:Z
      - ./volumes/db/init/17-seed-tenants.sql:/docker-entrypoint-initdb.d/migrations/zz-17-seed-tenants.sql:Z
      - ./volumes/db/init/18-20260731_self_hosted_rls_hardening.sql:/docker-entrypoint-initdb.d/migrations/zz-18-20260731_self_hosted_rls_hardening.sql:Z
      - ./volumes/db/init/19-20260731_connections_pair_unique.sql:/docker-entrypoint-initdb.d/migrations/zz-19-20260731_connections_pair_unique.sql:Z
      - ./volumes/db/init/20-20260731_social_rls_hardening.sql:/docker-entrypoint-initdb.d/migrations/zz-20-20260731_social_rls_hardening.sql:Z
      - ./volumes/db/init/21-20260807_verified_human_badge.sql:/docker-entrypoint-initdb.d/migrations/zz-21-20260807_verified_human_badge.sql:Z
      - ./volumes/db/init/22-20260810_career_goal.sql:/docker-entrypoint-initdb.d/migrations/zz-22-20260810_career_goal.sql:Z
      - ./volumes/db/init/23-20260811_audit_tables.sql:/docker-entrypoint-initdb.d/migrations/zz-23-20260811_audit_tables.sql:Z
      - ./volumes/db/init/24-20260811_drop_dead_tables.sql:/docker-entrypoint-initdb.d/migrations/zz-24-20260811_drop_dead_tables.sql:Z
      - ./volumes/db/init/25-0002_tayari_core_architecture.sql:/docker-entrypoint-initdb.d/migrations/zz-25-0002_tayari_core_architecture.sql:Z
      - ./volumes/db/init/26-20260812_omnisave_vector_dims.sql:/docker-entrypoint-initdb.d/migrations/zz-26-20260812_omnisave_vector_dims.sql:Z
      - ./volumes/db/init/27-20260813_durable_run_control_plane.sql:/docker-entrypoint-initdb.d/migrations/zz-27-20260813_durable_run_control_plane.sql:Z
      - ./volumes/db/init/28-20260813_waitlist_leads.sql:/docker-entrypoint-initdb.d/migrations/zz-28-20260813_waitlist_leads.sql:Z
      - ./volumes/db/init/29-20260814_tenant_rls_hardening.sql:/docker-entrypoint-initdb.d/migrations/zz-29-20260814_tenant_rls_hardening.sql:Z
      - ./volumes/db/init/30-20260815_omnisave_auto_sync.sql:/docker-entrypoint-initdb.d/migrations/zz-30-20260815_omnisave_auto_sync.sql:Z
      - ./volumes/db/init/31-20260815_runtime_reconciliation.sql:/docker-entrypoint-initdb.d/migrations/zz-31-20260815_runtime_reconciliation.sql:Z
      - ./volumes/db/init/32-20260815_05_omnisave_seed_import.sql:/docker-entrypoint-initdb.d/migrations/zz-32-20260815_05_omnisave_seed_import.sql:Z
      - ./volumes/db/init/33-20260815_06_omnisave_capture_provenance.sql:/docker-entrypoint-initdb.d/migrations/zz-33-20260815_06_omnisave_capture_provenance.sql:Z
      - ./volumes/db/init/34-20260817_resume_graph_owner.sql:/docker-entrypoint-initdb.d/migrations/zz-34-20260817_resume_graph_owner.sql:Z
      - ./volumes/db/init/35-20260817_stripe_webhook_events.sql:/docker-entrypoint-initdb.d/migrations/zz-35-20260817_stripe_webhook_events.sql:Z
      - ./volumes/db/init/37-20260817_ai_provenance.sql:/docker-entrypoint-initdb.d/migrations/zz-37-20260817_ai_provenance.sql:Z
      - ./volumes/db/init/38-20260817_computer_control.sql:/docker-entrypoint-initdb.d/migrations/zz-38-20260817_computer_control.sql:Z
      - ./volumes/db/init/39-20260818_google_workspace.sql:/docker-entrypoint-initdb.d/migrations/zz-39-20260818_google_workspace.sql:Z
      - ./volumes/db/init/40-20260819_agent_automation_notifications.sql:/docker-entrypoint-initdb.d/migrations/zz-40-20260819_agent_automation_notifications.sql:Z
      - ./volumes/db/init/41-20260820_automation_lease_recovery.sql:/docker-entrypoint-initdb.d/migrations/zz-41-20260820_automation_lease_recovery.sql:Z
      - ./volumes/db/init/42-20260821_automation_event_inbox.sql:/docker-entrypoint-initdb.d/migrations/zz-42-20260821_automation_event_inbox.sql:Z
      - ./volumes/db/init/43-20260822_saved_jobs_rls.sql:/docker-entrypoint-initdb.d/migrations/zz-43-20260822_saved_jobs_rls.sql:Z
      - ./volumes/db/init/44-20260823_external_research_runs.sql:/docker-entrypoint-initdb.d/migrations/zz-44-20260823_external_research_runs.sql:Z
      - ./volumes/db/init/45-20260824_omnisave_capture_runs.sql:/docker-entrypoint-initdb.d/migrations/zz-45-20260824_omnisave_capture_runs.sql:Z
      - ./volumes/db/init/47-20260821_task_artifacts.sql:/docker-entrypoint-initdb.d/migrations/zz-47-20260821_task_artifacts.sql:Z
      - ./volumes/db/init/48-20260821_task_control_leases.sql:/docker-entrypoint-initdb.d/migrations/zz-48-20260821_task_control_leases.sql:Z
      - ./volumes/db/init/49-20260823_billing_credits.sql:/docker-entrypoint-initdb.d/migrations/zz-49-20260823_billing_credits.sql:Z
      - ./volumes/db/init/50-20260823_whatsapp_approval_replies.sql:/docker-entrypoint-initdb.d/migrations/zz-50-20260823_whatsapp_approval_replies.sql:Z
      - ./volumes/db/init/51-20260824_public_data_access_hardening.sql:/docker-entrypoint-initdb.d/migrations/zz-51-20260824_public_data_access_hardening.sql:Z
      - ./volumes/db/init/52-20260825_candidate_spine_envelope.sql:/docker-entrypoint-initdb.d/migrations/zz-52-20260825_candidate_spine_envelope.sql:Z
      - ./volumes/db/init/53-20260825_practice_outcomes.sql:/docker-entrypoint-initdb.d/migrations/zz-53-20260825_practice_outcomes.sql:Z
      - ./volumes/db/init/54-20260825_agent_task_children.sql:/docker-entrypoint-initdb.d/migrations/zz-54-20260825_agent_task_children.sql:Z
      - ./volumes/db/init/55-20260825_memory_correction_controls.sql:/docker-entrypoint-initdb.d/migrations/zz-55-20260825_memory_correction_controls.sql:Z
      - ./volumes/db/init/56-20260826_fix_preference_summary_refresh_owner.sql:/docker-entrypoint-initdb.d/migrations/zz-56-20260826_fix_preference_summary_refresh_owner.sql:Z
      - ./volumes/db/init/57-20260827_task_input_files.sql:/docker-entrypoint-initdb.d/migrations/zz-57-20260827_task_input_files.sql:Z
      - ./volumes/db/init/58-20260827_agent_memory.sql:/docker-entrypoint-initdb.d/migrations/zz-58-20260827_agent_memory.sql:Z
      - ./volumes/db/init/59-20260827_saved_searches_parity.sql:/docker-entrypoint-initdb.d/migrations/zz-59-20260827_saved_searches_parity.sql:Z
      - ./volumes/db/init/60-20260827_job_watches_intelligence.sql:/docker-entrypoint-initdb.d/migrations/zz-60-20260827_job_watches_intelligence.sql:Z
      - ./volumes/db/init/61-20260827_self_hosted_table_parity.sql:/docker-entrypoint-initdb.d/migrations/zz-61-20260827_self_hosted_table_parity.sql:Z
      - ./volumes/db/init/62-20260828_self_hosted_pet_and_route_views.sql:/docker-entrypoint-initdb.d/migrations/zz-62-20260828_self_hosted_pet_and_route_views.sql:Z
      - ./volumes/db/init/63-20260903_canonical_application_state_machine.sql:/docker-entrypoint-initdb.d/migrations/zz-63-20260903_canonical_application_state_machine.sql:Z
      - ./volumes/db/init/64-20260903_outcome_events.sql:/docker-entrypoint-initdb.d/migrations/zz-64-20260903_outcome_events.sql:Z
      - ./volumes/db/init/65-20260903_agent_run_steps_self_hosted.sql:/docker-entrypoint-initdb.d/migrations/zz-65-20260903_agent_run_steps_self_hosted.sql:Z
      - ./volumes/db/init/66-20260903_run_checkpoints.sql:/docker-entrypoint-initdb.d/migrations/zz-66-20260903_run_checkpoints.sql:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test:
        [
        "CMD",
        "pg_isready",
        "-U",
        "postgres",
        "-h",
        "localhost"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - ${SUPABASE_DB_PORT:-54329}:5432
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal"
      ]

  supavisor:
    container_name: supabase-pooler
    image: supabase/supavisor:2.9.5
    restart: unless-stopped
    ports:
      - ${POOLER_PROXY_PORT_TRANSACTION}:6543
    volumes:
      - ./volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro,z
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "http://127.0.0.1:4000/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      RLIMIT_NOFILE: ${RLIMIT_NOFILE:-100000}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      CLUSTER_POSTGRES: true
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
    command:
      [
        "/bin/sh",
        "-c",
        "/app/bin/migrate && /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server"
      ]

