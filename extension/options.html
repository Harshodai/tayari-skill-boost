<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tayari Extension Settings</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0f172a;color:#f8fafc;padding:32px;max-width:540px;margin:0 auto}h1{font-size:20px;font-weight:600;margin-bottom:8px;color:#38bdf8}p{font-size:13px;color:#94a3b8;margin-bottom:24px;line-height:1.5}.form-group{margin-bottom:20px}label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;color:#cbd5e1}input{width:100%;padding:10px 12px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#f8fafc;font-size:14px;box-sizing:border-box}input:focus{outline:none;border-color:#38bdf8}.hint{font-size:11px;color:#64748b;margin-top:4px}.btn-group{display:flex;gap:10px}button{background:#0284c7;color:#fff;border:0;padding:10px 18px;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer}button.secondary{background:#334155}.status{margin-top:14px;font-size:13px;font-weight:500}.status.success{color:#4ade80}.status.error{color:#f87171}</style></head><body>
<h1>Tayari Extension Configuration</h1>
<p>Configure the Tayari API and web-app URLs used by the extension. Authentication is handled securely by the web app OAuth flow; no API key is stored here.</p>
<div class="form-group"><label for="apiUrl">Tayari API URL</label><input type="url" id="apiUrl" placeholder="http://localhost:8085/api" autocomplete="url"><div class="hint">The API base URL, including the <code>/api</code> path.</div></div>
<div class="form-group"><label for="appUrl">Tayari Web App URL</label><input type="url" id="appUrl" placeholder="http://localhost:8083" autocomplete="url"><div class="hint">Used for sign-in, signup, and authenticated onboarding.</div></div>
<div class="btn-group"><button id="saveBtn">Save Settings</button><button id="testBtn" class="secondary">Test Connection</button></div><div id="status" class="status" role="status" aria-live="polite"></div><script src="options.js"></script></body></html>
