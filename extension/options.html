<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tayari Extension Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 32px;
      max-width: 540px;
      margin: 0 auto;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #38bdf8; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; color: #cbd5e1; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    .hint { font-size: 11px; color: #64748b; margin-top: 4px; }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    .status { margin-top: 14px; font-size: 13px; font-weight: 500; }
    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }
  </style>
</head>
<body>
  <h1>Tayari Extension Configuration</h1>
  <p>Configure your self-hosted or cloud Tayari instance URL and API Key for secure message passing.</p>

  <div class="form-group">
    <label for="backendUrl">Tayari Backend URL</label>
    <input type="text" id="backendUrl" placeholder="http://localhost:8085">
    <div class="hint">The base URL of your self-hosted Tayari Go backend gateway.</div>
  </div>

  <div class="form-group">
    <label for="apiKey">API Key (TAYARI_API_KEY)</label>
    <input type="password" id="apiKey" placeholder="tay_...">
    <div class="hint">Generate an API key in your Tayari dashboard under Settings → API Keys.</div>
  </div>

  <button id="saveBtn">Save Settings</button>
  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
