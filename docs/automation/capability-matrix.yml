schema: tayari.agent-capability-matrix.v1
version: 1
owner: platform-safety
review_cadence_days: 30
truth_rule: code_presence_is_not_staging_or_production_evidence
capabilities:
  - id: agent.task_threads
    label: Durable task threads
    surface: backend/go/internal/api/routes_tasks.go
    state: deterministic_implemented
    risk_tier: read
    approval: plan_approval
    required_evidence: [owner_predicates, immutable_events, restart_recovery]
  - id: agent.plan_review
    label: Plan preview and approval
    surface: task_plans
    state: deterministic_implemented
    risk_tier: draft
    approval: explicit_owner_decision
    required_evidence: [version_binding, stale_plan_rejection, audit_event]
  - id: agent.action_proposals
    label: Risk-tiered action proposals
    surface: action_proposals
    state: deterministic_implemented
    risk_tier: external_write
    approval: explicit_owner_decision
    required_evidence: [expiry, exact_snapshot_binding, replay_rejection, manual_submit_boundary]
  - id: agent.handoff
    label: Durable human handoff
    surface: backend/python/app/services/handoff_service.py
    state: deterministic_implemented
    risk_tier: sensitive
    approval: owner_bound_handoff
    required_evidence: [hashed_token, expiry, version_binding, resume_owner_check]
  - id: agent.run_control
    label: Cancel, pause, resume, takeover, and worker lease control
    surface: backend/python/app/services/run_control.py
    state: deterministic_implemented
    risk_tier: sensitive
    approval: none
    required_evidence: [server_side_cancel, resource_termination, restart_recovery]
  - id: agent.files_and_artifacts
    label: File and artifact context
    surface: backend/go/internal/api and src
    state: partial
    risk_tier: draft
    approval: external_delivery_review
    required_evidence: [owner_scoping, provenance, retention, deletion]
  - id: agent.code_workspace
    label: Code/workspace edit and diff review
    surface: staged_agent_workspace
    state: staged_design
    risk_tier: external_write
    approval: exact_diff_review
    required_evidence: [sandbox, diff_hash, rollback, secret_scan, tenant_isolation]
  - id: agent.computer
    label: Isolated and local-browser computer use
    surface: Tayari Computer controls and extension
    state: deterministic_implemented_staging_required
    risk_tier: sensitive
    approval: takeover_or_action_approval
    required_evidence: [trajectory_injection_resistance, real_teardown, stop_latency, two_tenant_isolation]
  - id: automation.definitions
    label: User-managed automation definitions
    surface: planned_automation_definitions
    state: planned
    risk_tier: external_write
    approval: activation_approval
    required_evidence: [tool_allowlist, budget, retention, policy_version]
  - id: automation.triggers
    label: Schedule and event-triggered execution
    surface: planned_automation_triggers
    state: planned
    risk_tier: read
    approval: activation_approval
    required_evidence: [webhook_signature, replay_protection, idempotency, outage_behavior]
  - id: automation.checkpoints
    label: Durable checkpoints and resume
    surface: planned_automation_checkpoints
    state: planned
    risk_tier: sensitive
    approval: none
    required_evidence: [state_machine, version_binding, worker_restart, rollback]
  - id: notifications.email
    label: Transactional approval email
    surface: planned_notification_adapters
    state: planned_disabled
    risk_tier: external_write
    approval: channel_consent_and_action_approval
    required_evidence: [sandbox_send, delivery_receipt, bounce, complaint, revoke, outage]
  - id: notifications.whatsapp
    label: WhatsApp approval notifications and replies
    surface: planned_notification_adapters
    state: planned_disabled
    risk_tier: external_write
    approval: channel_opt_in_and_action_approval
    required_evidence: [template, opt_in, webhook_signature, delivery_status, opt_out, replay_rejection]
  - id: notifications.in_app_fallback
    label: In-app approval queue fallback
    surface: action_proposals and task UI
    state: deterministic_implemented
    risk_tier: read
    approval: explicit_owner_decision
    required_evidence: [truthful_delivery_state, owner_scoping, expiry]
  - id: integrations.google_workspace
    label: Gmail, Calendar, and Drive read-only integration
    surface: Google Workspace routes and adapters
    state: deterministic_implemented_staging_required
    risk_tier: sensitive
    approval: provider_consent
    required_evidence: [scope_confirmation, refresh, revocation, deletion, two_tenant_isolation]
  - id: integrations.mcp_a2a
    label: MCP and A2A governed tools
    surface: integration adapters
    state: deterministic_implemented_staging_required
    risk_tier: external_write
    approval: tool_and_action_policy
    required_evidence: [allowlist, signed_messages, replay_protection, provenance, outage]
  - id: autonomous.ats_submission
    label: Autonomous external job submission
    surface: submission_guard
    state: permanently_disabled_first_release
    risk_tier: submission
    approval: not_sufficient_to_enable
    required_evidence: [explicit_product_reauthorization, independent_review]
