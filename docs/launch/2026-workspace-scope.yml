version: 1
environment: production
release_scope: candidate_controlled_workspace

capabilities:
  workspace.auth:
    state: enabled_after_staging_gates
    description: Account, profile, session, and recovery lifecycle.
  workspace.resume:
    state: enabled_after_staging_gates
    description: Resume upload, parsing, preview, history, and user-approved variants.
  workspace.public_import:
    state: enabled_after_staging_gates
    description: Candidate-selected public job-description and knowledge-source import.
  workspace.ats_assistance:
    state: enabled_after_staging_gates
    description: Heuristic ATS and resume assistance with explicit unavailable states.
  workspace.knowledge_hub:
    state: enabled_after_staging_gates
    description: Cited public-source knowledge workspace with deletion controls.
  workspace.interview_prep:
    state: enabled_after_staging_gates
    description: Assisted interview preparation; no claim of interview outcome prediction.
  workspace.application_tracker:
    state: enabled_after_staging_gates
    description: Candidate-owned application pipeline and status tracking.
  workspace.isolated_computer:
    state: staged_only
    description: Private OpenSandbox computer runs; requires real isolation, teardown, and recovery evidence.
  workspace.local_browser_bridge:
    state: staged_only
    description: Explicit candidate-authorized local browser bridge; requires takeover, revoke, origin, and stop evidence.
  workspace.local_browser_sensitive_actions:
    state: disabled
    reason: Sensitive local-browser actions remain candidate-takeover-only in the first release.
  workspace.computer_submission:
    state: disabled
    reason: Computer-mediated external submission is permanently disabled in the first release.

  autonomous.browser:
    state: disabled
    reason: Requires isolated browser, takeover, approval binding, receipt, and recovery proof.
  autonomous.ats_submit:
    state: disabled
    reason: No public autonomous portal submission claim in the initial release.
  autonomous.gmail:
    state: disabled
    reason: Requires mailbox scope, Pub/Sub, renewal, refresh, deletion, and privacy proof.
  workspace.google.calendar:
    state: disabled
    reason: Requires verified read-only OAuth scope, tenant-bound token storage, revocation, Calendar sync, provenance, provider outage, and staging evidence.
  workspace.google.drive:
    state: disabled
    reason: Requires verified metadata-only OAuth scope, tenant-bound token storage, revocation, metadata-only sync, provenance, provider outage, and staging evidence.
  autonomous.messaging:
    state: disabled
    reason: Requires provider opt-in, delivery, revocation, and webhook proof.
  autonomous.billing:
    state: disabled
    reason: Requires official Stripe test-mode reconciliation and refund proof.
  autonomous.irreversible_jobs:
    state: disabled
    reason: Requires worker-kill idempotency and external side-effect recovery proof.

claims_excluded:
  - autonomous_external_ats_submission
  - private_saved_list_synchronization
  - production_messaging_campaigns
  - customer_visible_billing
  - hiring_outcome_prediction

promotion_requirements:
  - real_go_true_two_tenant_isolation
  - route_authorization_inventory
  - real_backup_restore_rpo_rto
  - immutable_image_digest_sbom_attestation
  - production_canary_and_rollback
