dataset:
  name: tayari_resume_v1
  version: "1.0.0"
  description: 20 stratified test cases for resume optimization pipeline
  schema:
    - id: str
    - category: str  # {fresh_grad, mid_career, senior_exec, career_change, gap_resume, non_standard}
    - resume_text: str
    - job_description: str
    - expected_tags: list[str]  # e.g. [truthful, keyword_stuffing, pii_clean, length_ok]
    - expected_min_ats_score: int
    - expected_sections: list[str]  # [experience, education, skills, summary]
  cases:
    - id: rso-001
      category: fresh_grad
      resume_text: |
        John Doe
        john.doe@example.com
        New York, NY
        EDUCATION
        Bachelor of Science in Computer Science, NYU, 2023
        SKILLS
        Python, JavaScript, SQL, Git
        PROJECTS
        Built a web app using React and Node.js for a class project.
      job_description: |
        Junior Software Engineer
        We need a Junior Software Engineer with Python, JavaScript, and React experience.
      expected_tags: [truthful, keyword_stuffing, pii_clean, length_ok]
      expected_min_ats_score: 55
      expected_sections: [education, skills]

    - id: rso-002
      category: fresh_grad
      resume_text: |
        Jane Smith
        jane.smith@example.com
        Boston, MA
        EDUCATION
