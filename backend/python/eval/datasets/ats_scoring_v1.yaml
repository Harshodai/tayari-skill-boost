      expected_max_score: 100
      expected_checks: ["Contact email", "Phone number", "Experience section", "Education section", "Skills section", "Summary / objective", "Optimal length", "Bullet points", "Action verbs", "Quantified achievements", "Dates present", "Recent experience visible"]
