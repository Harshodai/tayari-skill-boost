name: CI/CD Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      JWT_SECRET: test-only-secret-please-change
      APPROVAL_SIGNING_KEY: test-approval-key
      PYTHONPATH: ${{ github.workspace }}/backend/python
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          set -e
          cd backend/python
          pip install -r requirements.txt
          pip install pytest pytest-cov 'pytest-asyncio==1.4.0'

      - name: Run backend tests with coverage
        run: |
          set -e
          cd backend/python
          # Use the same full suite and 60% non-regression floor as main CI;
          # app/tests alone reaches only 47% because the service has multiple
          # integration modules outside that focused fixture set.
          python -m pytest app/tests tests --cov=app --cov-report=term-missing --cov-fail-under=60

      - name: Set up Bun
        run: npm install --global --no-audit --no-fund bun@1.3.14

      - name: Install frontend dependencies
        run: |
          bun install --frozen-lockfile

      - name: Lint and type check
        run: |
          set -e
          bun run lint
          bunx tsc --noEmit

      - name: Run frontend tests with coverage
        run: |
          set -e
          bun run test -- --coverage

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: https://ci.example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
          VITE_API_URL: https://api.example.com/api
          VITE_USE_SELF_HOSTED: 'false'
        run: |
          bun run build

      - name: Prepare Docker Compose build environment
        run: |
          cp .env.example .env
          cp supabase-local/.env.example supabase-local/.env

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build

      # Promotion is intentionally separate from CI. Use
      # scripts/deploy-environment.sh only after immutable image digests and
      # explicit environment approval have been recorded.
