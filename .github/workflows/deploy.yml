name: CI/CD Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          set -e
          cd backend/python
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run backend tests with coverage
        run: |
          set -e
          cd backend/python
          pytest app/tests --cov=app --cov-fail-under=80

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: |
          bun install --frozen-lockfile

      - name: Lint and type check
        run: |
          set -e
          bun run lint
          bunx tsc --noEmit

      - name: Run frontend tests with coverage
        run: |
          set -e
          bun run test -- --coverage

      - name: Build frontend
        run: |
          bun run build

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build

      # Promotion is intentionally separate from CI. Use
      # scripts/deploy-environment.sh only after immutable image digests and
      # explicit environment approval have been recorded.
