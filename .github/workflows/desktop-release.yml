name: Desktop release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-14
            target: --mac --arm64
            artifact_glob: "release/Job Tayari Desktop-*"
          - platform: Windows x64
            runner: windows-latest
            target: --win --x64
            artifact_glob: "release/Job Tayari Desktop-*"
          - platform: Linux x64
            runner: ubuntu-latest
            target: --linux --x64
            artifact_glob: "release/Job Tayari Desktop-*"

    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop application
        run: pnpm exec node scripts/build-desktop.mjs ${{ matrix.target }}

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tayari-desktop-${{ matrix.runner }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error


  extension:
    name: Package Chrome extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Package Chrome extension
        run: node scripts/package-extension.mjs
      - name: Upload Chrome extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tayari-chrome-extension
          path: release/Job-Tayari-Chrome-Extension.zip
          if-no-files-found: error
  publish:
    name: Publish tagged desktop release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [package, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tayari-*
          path: release-assets
          merge-multiple: true

      - name: Publish release artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.2
        with:
          files: |
            release-assets/Job Tayari Desktop-*
            release-assets/Job-Tayari-Chrome-Extension.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
