name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-build:
    name: Go Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        working-directory: backend/go
        run: go build -o tayari-backend ./cmd/server/main.go

      - name: Test
        working-directory: backend/go
        run: go test -race ./...

      - name: Coverage Check
        working-directory: backend/go
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | grep total | awk '{print $3}' | cut -d. -f1 | {
            read cov
            if [ "$cov" -lt 80 ]; then
              echo "Go coverage $cov% is below 80%"
              exit 1
            fi
          }

  python-build:
    name: Python AI Service & Integrations Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend/python
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest-cov
          pip install -r requirements.txt

      - name: LLM Engine Sanity Check
        run: |
          # Verify LLM is either configured (real provider) or known-unconfigured.
          # Fails if the code logic has regressed to returning mock data.
          python - << 'PYEOF'
          import sys
          sys.path.insert(0, 'backend/python')
          from app.services.llm_service import build_provider, MockProvider
          p = build_provider()
          label = p.active_engine_label()
          if isinstance(p, MockProvider):
              print(f"WARNING: LLM provider is unconfigured (MockProvider). Set LLM_PROVIDER env in prod.")
              # In CI with no LLM keys this is expected — just warn, don't fail.
              # In prod the Docker health-check ensures ACTIVE_ENGINE != 'unconfigured'.
          else:
              print(f"OK: LLM provider = {label}")
          PYEOF

      - name: PyCompile & Ruff (Python AI & Integrations)
        run: |
          python -m py_compile integrations/jobtheory_mcp/server.py
          python -m py_compile $(find backend/python/app -name "*.py")
          ruff check integrations/ backend/python/

      - name: MCP Server Import Smoke Test
        run: |
          python -c "import sys; sys.path.insert(0,'integrations/jobtheory_mcp'); import server; print(f'MCP Tools: {len(server.mcp._tool_manager.list_tools())}')"

      - name: Test
        working-directory: backend/python
        run: pytest

      - name: Coverage Check
        working-directory: backend/python
        run: |
          pytest --cov=app --cov-report=term-missing
          COVERAGE=$(pytest --cov=app --cov-report=term | grep TOTAL | awk '{print $4}' | cut -d% -f1)
          if [ "$COVERAGE" -lt 80 ]; then
            echo "Python coverage $COVERAGE% is below 80%"
            exit 1
          fi

  extension-build:
    name: Chrome Extension Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node/Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies & check extension
        working-directory: extension
        run: |
          bun install --no-save 2>/dev/null || npm install
          npx tsc --noEmit
          npx eslint . --ignore-pattern "node_modules/"

  frontend-build:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Unit Test Suite
        run: bun run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: bun run test:e2e

  gitleaks-scan:
    name: Gitleaks History Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker-compose:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          POSTGRES_PASSWORD=tayari_test_2026
          JWT_SECRET=test-jwt-secret-for-ci-only-change-me
          ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICJyb2xlIjogImFub24iLAogICAiaXNzIjogInN1cGFiYXNlLWRlbW8iLAogICAiaWF0IjogMTY0MTc2OTIwMCwKICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE
          SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICJyb2xlIjogInNlcnZpY2Vfcm9sZSIsCiAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICJpYXQiOiAxNjQxNzY5MjAwLAogICJleHAiOiAxNzk5NTM1NjAwCn0.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q
          EOF

      - name: Start full stack
        run: docker compose up -d --wait
        timeout-minutes: 10

      - name: Health check – Go backend
        run: |
          curl -sSf --retry 10 --retry-delay 5 http://localhost:8085/api/health || exit 1

      - name: Health check – Python AI
        run: |
          curl -sSf --retry 10 --retry-delay 5 http://localhost:8002/health || exit 1

      - name: Health check – Supabase Kong
        run: |
          curl -sSf --retry 10 --retry-delay 5 http://localhost:8008/health || exit 1

      - name: Health check – Supabase Studio
        run: |
          curl -sSf --retry 10 --retry-delay 5 http://localhost:3005 || exit 1

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

  performance:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: docker-compose
    steps:
      - uses: actions/checkout@v4

      - name: Ensure script is executable
        run: chmod +x scripts/perf_check.sh

      - name: Run performance benchmark
        id: perf
        run: |
          ./scripts/perf_check.sh

      - name: Post performance annotation
        if: always()
        run: |
          DURATION=$(cat perf_time.txt)
          echo "::notice title=Performance Benchmark::Autopilot execution time ${DURATION}s"
