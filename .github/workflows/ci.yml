name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-build:
    name: Go Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'

      - name: Build
        working-directory: backend/go
        run: go build -o tayari-backend ./cmd/server/main.go

      - name: Test
        working-directory: backend/go
        run: go test -race ./...

      - name: Coverage Check
        working-directory: backend/go
        run: |
          # Run package profiles independently. Some runner Go distributions do
          # not ship the optional covdata helper used by aggregate profiles.
          GO_COVERAGE_MIN=20 bash ../../scripts/check_go_coverage.sh

  python-build:
    name: Python AI Service & Integrations Lint
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      JWT_SECRET: test-only-secret-please-change
      APPROVAL_SIGNING_KEY: test-approval-key
      TAYARI_API_KEY: ci-placeholder
      PYTHONPATH: ${{ github.workspace }}/backend/python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend/python
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff==0.9.2' 'pytest-asyncio==1.4.0' pytest-cov bandit pip-audit
          pip install -r requirements.txt
          pip install -r ../../integrations/jobtheory_mcp/requirements.txt

      - name: Dependency Audit (blocking)
        working-directory: backend/python
        run: pip-audit --requirement requirements.txt --requirement ../../integrations/jobtheory_mcp/requirements.txt --progress-spinner off --strict

      - name: LLM Engine Sanity Check
        run: |
          # Verify LLM is either configured (real provider) or known-unconfigured.
          # Fails if the code logic has regressed to returning fabricated mock data
          # instead of raising LLMNotConfiguredError.
          python - << 'PYEOF'
          import asyncio
          import sys
          sys.path.insert(0, 'backend/python')
          from app.services.llm_service import build_provider, MockProvider, LLMNotConfiguredError

          async def main():
              p = build_provider()
              if isinstance(p, MockProvider):
                  try:
                      await p.complete("sanity check", "sanity check")
                  except LLMNotConfiguredError:
                      print("WARNING: LLM provider is unconfigured (MockProvider). Set LLM_PROVIDER env in prod.")
                      # In CI with no LLM keys this is expected — just warn, don't fail.
                      # In prod the Docker health-check ensures ACTIVE_ENGINE != 'unconfigured'.
                      return
                  except Exception as exc:
                      print(f"FAIL: MockProvider.complete() raised {type(exc).__name__} instead of LLMNotConfiguredError: {exc}")
                      sys.exit(1)
                  print("FAIL: MockProvider.complete() returned normally instead of raising LLMNotConfiguredError — regression risk of fabricated AI data.")
                  sys.exit(1)
              else:
                  print(f"OK: LLM provider = {p.active_engine_label()}")

          asyncio.run(main())
          PYEOF

      - name: PyCompile & Ruff (Python AI & Integrations)
        run: |
          python -m py_compile integrations/jobtheory_mcp/server.py
          python -m py_compile $(find backend/python/app -name "*.py")
          # This is the repository’s explicit compatibility policy: retain
          # syntax, import, and undefined-name checks while allowing documented
          # legacy import placement, unused compatibility imports, and existing
          # test fixture patterns to be migrated incrementally.
          ruff check --select E4,E7,E9,F --ignore E402,E731,E741,F401,F841,F811,F541 integrations/ backend/python/

      - name: Bandit SAST Scan (Python AI Engine)
        run: |
          bandit -r backend/python/app integrations/ --exclude backend/python/app/tests -ll -ii

      - name: MCP Server Import Smoke Test
        run: |
          python -c "import sys; sys.path.insert(0,'integrations/jobtheory_mcp'); import server; print(f'MCP Tools: {len(server.mcp._tool_manager.list_tools())}')"

      - name: MCP URL and tool contract
        run: python scripts/mcp_contract_test.py

      - name: Test
        working-directory: backend/python
        run: pytest

      - name: Coverage Check
        working-directory: backend/python
        run: |
          # Full app + integration tests currently establish a 65% baseline;
          # enforce a 60% non-regression floor rather than an unreachable 80%
          # app-tests-only threshold.
          pytest app/tests tests --cov=app --cov-report=term-missing --cov-fail-under=60

  extension-build:
    name: Chrome Extension Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate extension manifest and JavaScript
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"
          find extension -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  frontend-build:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: VITE_SUPABASE_URL=https://ci.example.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci VITE_API_URL=https://api.example.com/api VITE_USE_SELF_HOSTED=false bun run build

      - name: Website release contract
        run: node scripts/website_release_contract.mjs

      - name: Unit Test Suite
        run: bun run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run public Playwright E2E tests
        run: bun run test:e2e -- e2e/public_routes.spec.ts

  desktop-contract:
    name: macOS Desktop Contract
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run desktop release contract
        run: bash scripts/mac_release_contract_test.sh

  gitleaks-scan:
    name: Gitleaks History Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-regression:
    name: Security Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Re-run security scan and fail on new findings
        # Compares the current scan against security/baseline.json. Pre-existing
        # findings are reported but tolerated; any NEW finding fails the build.
        # Accept a new finding deliberately with `bun run security:baseline`.
        run: bun run security:scan

      - name: Upload scan report
        if: always()
        run: node scripts/security_scan.mjs --json > security-report.json || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-scan-report
          path: security-report.json



  docker-compose:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify self-hosted migration bundle
        run: python3 scripts/verify_self_hosted_migrations.py

      - name: Create .env files
        run: |
          # Root and supabase-local/ are two separate Compose projects merged
          # via `include:` — each resolves ${VAR} against its own env file.
          # POSTGRES_PASSWORD and JWT_SECRET must be identical across both
          # (see CLAUDE.md) or every login silently looks like an invalid
          # token instead of an obviously-wrong-secret error.
          cat > .env << 'EOF'
          COMPOSE_PROFILES=dev
          POSTGRES_PASSWORD=tayari_test_2026
          JWT_SECRET=test-jwt-secret-for-ci-only-change-me-32ch
          USE_SUPABASE=true
          VITE_USE_SELF_HOSTED=false
          VITE_SUPABASE_URL=http://localhost:8000
          SUPABASE_URL=http://kong:8000
          FLOWER_USER=ci
          FLOWER_PASSWORD=ci-flower-password
          EOF

          # Base off the real .env.example so every other required var (Kong
          # ports, mailer paths, pooler config, ...) gets a working default —
          # only override the secrets that must match root's .env above.
          cp supabase-local/.env.example supabase-local/.env
          sed -i \
            -e 's#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=tayari_test_2026#' \
            -e 's#^JWT_SECRET=.*#JWT_SECRET=test-jwt-secret-for-ci-only-change-me-32ch#' \
            supabase-local/.env

          # Kong's key-auth plugin does exact-string matching against the
          # configured ANON_KEY (not JWT signature verification) — a
          # separately hardcoded literal here can silently drift from
          # supabase-local's real key and 401 every Kong-routed request.
          # Pull the real value out instead.
          ANON_KEY=$(grep '^ANON_KEY=' supabase-local/.env | cut -d= -f2-)
          cat >> .env << EOF
          VITE_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}
          SUPABASE_ANON_KEY=${ANON_KEY}
          EOF

      - name: Start full stack
        run: docker compose --profile dev up -d --wait
        timeout-minutes: 10

      - name: Health check – Go backend
        run: |
          curl -sSf --retry 10 --retry-delay 5 http://localhost:8085/api/health || exit 1

      - name: Health check – Python AI
        run: |
          curl -sSf --retry 10 --retry-delay 5 http://localhost:8002/health || exit 1

      - name: Health check – Supabase Kong
        run: |
          # Kong has no bare /health route in this stack's declarative
          # config — it 401s unauthenticated requests to any real route.
          # That 401 (not a connection failure) is the "Kong is up and
          # routing" signal, so don't use `curl -f`, which treats any
          # non-2xx as failure.
          curl -sS --retry 10 --retry-delay 5 -o /dev/null -w '%{http_code}\n' http://localhost:8000/ | grep -qE '^(200|401|404)$'

      - name: Health check – Supabase Studio
        run: |
          # Studio redirects (307) its root path — same non-2xx-but-alive
          # situation as Kong above.
          curl -sS --retry 10 --retry-delay 5 -o /dev/null -w '%{http_code}\n' http://localhost:3001/ | grep -qE '^(200|307)$'

      - name: Verify required Omnisave tables
        run: |
          docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc "\
            SELECT CASE WHEN bool_and(to_regclass('public.' || table_name) IS NOT NULL) THEN 'ok' ELSE 'missing' END\
            FROM unnest(ARRAY['saved_sources', 'source_chunks']) AS required(table_name);" | grep -qx 'ok'

      - name: Set up Bun for authenticated E2E
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install frontend E2E dependencies
        run: bun install --frozen-lockfile

      - name: Run authenticated Playwright E2E tests
        env:
          PLAYWRIGHT_REUSE_EXISTING_SERVER: 'true'
        run: |
          # Use a disposable password generated inside the runner; never use
          # a customer credential or print the value in workflow logs.
          export E2E_TEST_PASSWORD="$(openssl rand -hex 24)"
          bun run test:e2e -- e2e/smoke.spec.ts

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down full stack
        if: always()
        run: docker compose --profile dev down -v --remove-orphans

  performance:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: docker-compose
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Ensure script is executable
        run: chmod +x scripts/perf_check.sh

      - name: Run performance benchmark
        id: perf
        run: |
          ./scripts/perf_check.sh

      - name: Post performance annotation
        if: always()
        run: |
          DURATION=$(cat perf_time.txt)
          echo "::notice title=Performance Benchmark::Autopilot execution time ${DURATION}s"
