name: Kubernetes Delivery Validation

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/kubernetes.yml'
      - 'backend/go/**'
      - 'backend/python/**'
      - 'Dockerfile*'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/kubernetes.yml'
      - 'backend/go/**'
      - 'backend/python/**'
      - 'Dockerfile*'

permissions:
  contents: read

concurrency:
  group: kubernetes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-validate:
    name: Render Kubernetes overlays and validate scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install release-contract test dependency
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'PyYAML==6.0.2'

      - name: Verify deploy scripts parse
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          for script in scripts/build-images.sh scripts/render-manifests.sh scripts/deploy-environment.sh scripts/release_contract_test.sh scripts/smoke-test.sh scripts/rollback.sh scripts/drain-workers.sh; do
            bash -n "$script"
          done

      - name: Verify release contract
        run: |
          set -euo pipefail
          chmod +x scripts/release_contract_test.sh
          scripts/release_contract_test.sh

      - name: Render each environment
        env:
          TRUSTED_PROXY_CIDRS: '10.0.0.0/8'
          LLM_PROVIDER: 'ci-placeholder'
          LLM_MODEL_FAST: 'ci-fast'
          LLM_MODEL_SMART: 'ci-smart'
        run: |
          set -euo pipefail
          mkdir -p rendered
          for environment in development staging production; do
            scripts/render-manifests.sh "$environment" "rendered/${environment}.yaml" --allow-placeholders
            test -s "rendered/${environment}.yaml"
            grep -q 'kind: Deployment' "rendered/${environment}.yaml"
            grep -q 'kind: NetworkPolicy' "rendered/${environment}.yaml"
          done

      - name: Check deployment safety invariants
        run: |
          set -euo pipefail
          ! grep -R --line-number 'image: .*:latest' infra/k8s
          ! grep -R --line-number 'privileged: true' infra/k8s
          ! grep -R --line-number 'hostNetwork: true' infra/k8s
          ! grep -R --line-number 'hostPID: true' infra/k8s
          grep -R --line-number 'allowPrivilegeEscalation: false' infra/k8s/base/deployments
          grep -R --line-number 'readOnlyRootFilesystem: true' infra/k8s/base/deployments

      - name: Upload rendered manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendered-kubernetes-manifests
          path: rendered/
          retention-days: 14
