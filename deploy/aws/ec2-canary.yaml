AWSTemplateFormatVersion: '2010-09-09'
Description: Job Tayari low-cost manual-submit EC2 canary host.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with an Internet Gateway route.
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Ubuntu 24.04 LTS amd64 AMI in the selected region.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t4g.micro]
  AdminCidr:
    Type: String
    Description: Your current public IP in CIDR form, for example 203.0.113.10/32.
  PublicDomain:
    Type: String
    Description: DNS name that will point to the instance public IP.

Resources:
  TayariSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Job Tayari public web ingress and restricted admin access.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: tayari-canary-sg

  TayariInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Service
          Value: tayari

  TayariInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref TayariInstanceRole]

  TayariInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref TayariInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref TayariSecurityGroup]
      AssociatePublicIpAddress: true
      Monitoring: false
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 30
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl git jq unzip
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable --now docker
          usermod -aG docker ubuntu
          install -d -o ubuntu -g ubuntu /opt/tayari
          printf '%s\n' 'EC2 bootstrap complete. Copy the repository and deploy/aws/.env, then run deploy/aws/deploy.sh config and up.' > /opt/tayari/BOOTSTRAPPED
          chown ubuntu:ubuntu /opt/tayari/BOOTSTRAPPED

      Tags:
        - Key: Name
          Value: tayari-canary
        - Key: Service
          Value: tayari
        - Key: Environment
          Value: canary

Outputs:
  InstanceId:
    Value: !Ref TayariInstance
  PublicIp:
    Value: !GetAtt TayariInstance.PublicIp
  PublicDnsName:
    Value: !GetAtt TayariInstance.PublicDnsName
  SecurityGroupId:
    Value: !Ref TayariSecurityGroup
  SsmCommand:
    Value: !Sub 'aws ssm start-session --target ${TayariInstance}'
