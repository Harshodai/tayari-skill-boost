server {
    listen 8000;

    # ponytail: an nginx `upstream {server python-ai:8000}` block resolves
    # the hostname ONCE at nginx startup and never again — when python-ai's
    # container is recreated (rebuild, restart) it gets a new internal IP,
    # and every request here kept hitting the old dead IP with
    # "connect() failed (111: Connection refused)" until python-lb itself
    # was restarted. Docker's embedded DNS (127.0.0.11) plus a variable in
    # proxy_pass forces nginx to re-resolve on every request instead of
    # caching the IP for the container's lifetime.
    resolver 127.0.0.11 valid=10s;
    set $python_ai_upstream http://python-ai:8000;

    location / {
        proxy_pass $python_ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Must be >= the longest synchronous Go->Python call routed through
        # here. Was 240s; Go's handleBrowserAutomation (routes_browser.go)
        # opens a 300s (browserRunTimeout) context for a blocking browser
        # automation run, matching Python's BROWSER_RUN_TIMEOUT_SECONDS=300
        # (browser_agent_routes.py) — but this proxy sat between them at
        # 240s and would 504 the call before either side's own budget
        # expired. Also raise Go's global middleware.Timeout (router.go)
        # and the front-door nginx (nginx.conf, infra/routing/nginx.conf)
        # in lockstep — all three must stay >= this value.
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
