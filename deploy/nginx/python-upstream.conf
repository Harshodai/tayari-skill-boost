upstream python_ai {
    least_conn;
    server python-ai:8000;
}

server {
    listen 8000;
    location / {
        proxy_pass http://python_ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Must be >= the longest synchronous Go->Python call routed through
        # here. Was 240s; Go's handleBrowserAutomation (routes_browser.go)
        # opens a 300s (browserRunTimeout) context for a blocking browser
        # automation run, matching Python's BROWSER_RUN_TIMEOUT_SECONDS=300
        # (browser_agent_routes.py) — but this proxy sat between them at
        # 240s and would 504 the call before either side's own budget
        # expired. Also raise Go's global middleware.Timeout (router.go)
        # and the front-door nginx (nginx.conf, infra/routing/nginx.conf)
        # in lockstep — all three must stay >= this value.
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
