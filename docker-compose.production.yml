# Production-only Compose profile. This file deliberately contains no build
# directives, source bind mounts, local Supabase stack, Ollama, or development
# credentials. Supply immutable registry digests and external state services.
services:
  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be an immutable image digest}
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  python-ai:
    image: ${PYTHON_API_IMAGE:?PYTHON_API_IMAGE must be an immutable image digest}
    environment:
      ENV: production
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?APPROVAL_SIGNING_KEY is required}
      UVICORN_RELOAD: "false"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER is required}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-}
      LLM_MODEL_SMART: ${LLM_MODEL_SMART:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_MODEL_FAST: ${OPENROUTER_MODEL_FAST:-}
      OPENROUTER_MODEL_SMART: ${OPENROUTER_MODEL_SMART:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-}
      NOTIFICATIONS_UNSUBSCRIBE_URL: ${NOTIFICATIONS_UNSUBSCRIBE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5

  celery-worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be an immutable image digest}
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?APPROVAL_SIGNING_KEY is required}
      LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER is required}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-}
      LLM_MODEL_SMART: ${LLM_MODEL_SMART:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_MODEL_FAST: ${OPENROUTER_MODEL_FAST:-}
      OPENROUTER_MODEL_SMART: ${OPENROUTER_MODEL_SMART:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-}
      NOTIFICATIONS_UNSUBSCRIBE_URL: ${NOTIFICATIONS_UNSUBSCRIBE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      python-ai:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be an immutable image digest}
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?APPROVAL_SIGNING_KEY is required}
      LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER is required}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-}
      LLM_MODEL_SMART: ${LLM_MODEL_SMART:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-}
      NOTIFICATIONS_UNSUBSCRIBE_URL: ${NOTIFICATIONS_UNSUBSCRIBE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-backend:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE must be an immutable image digest}
    environment:
      ENV: production
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AI_SERVICE_URL: http://python-ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?APPROVAL_SIGNING_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS is required}
      SENTRY_ENVIRONMENT: production
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      python-ai:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable image digest}
    depends_on:
      go-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE must be an immutable image digest}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?CADDY_DOMAIN is required}
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required}
    depends_on:
      frontend:
        condition: service_healthy
      go-backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

configs:
  caddyfile:
    file: ./Caddyfile

volumes:
  redis_data:
  caddy_data:
  caddy_config:
