apiVersion: batch/v1
kind: CronJob
metadata:
  name: tayari-synthetic-health-ghost
  labels:
    app.kubernetes.io/name: tayari-synthetic-health-ghost
    app.kubernetes.io/component: synthetic-observability
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: tayari-synthetic-health-ghost
        app.kubernetes.io/component: synthetic-observability
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tayari-synthetic-health-ghost
            app.kubernetes.io/component: synthetic-observability
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: k6
              image: grafana/k6:<PINNED_DIGEST_REQUIRED>
              imagePullPolicy: IfNotPresent
              command: ["k6", "run", "/scripts/synthetic.js"]
              env:
                - name: BASE_URL
                  value: "https://<APPROVED-STAGING-HOST>"
                - name: RAMP_VUS
                  value: "2"
                - name: HOLD_SECONDS
                  value: "30"
                - name: RAMP_SECONDS
                  value: "15"
                - name: REQUIRE_REQUEST_ID
                  value: "true"
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: tayari-synthetic-k6-script
                defaultMode: 0444
            - name: tmp
              emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tayari-synthetic-k6-script
  labels:
    app.kubernetes.io/name: tayari-synthetic-health-ghost
    app.kubernetes.io/component: synthetic-observability
data:
  synthetic.js: |
    # Populate this ConfigMap from perf/k6/synthetic.js during an approved release.
    # The CronJob intentionally remains a template until the script is injected
    # and the image is pinned by digest.
