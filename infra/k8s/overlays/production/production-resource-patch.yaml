apiVersion: apps/v1
kind: Deployment
metadata:
  name: tayari-go-gateway
spec:
  template:
    spec:
      containers:
        - name: go-gateway
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tayari-python-api
spec:
  template:
    spec:
      containers:
        - name: python-ai
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 2Gi
