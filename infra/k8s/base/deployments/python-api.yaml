apiVersion: apps/v1
kind: Deployment
metadata:
  name: tayari-python-api
  labels:
    app.kubernetes.io/name: python-ai
    app.kubernetes.io/component: ai-api
    app.kubernetes.io/part-of: job-tayari
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-ai
        app.kubernetes.io/component: ai-api
        app.kubernetes.io/part-of: job-tayari
    spec:
      serviceAccountName: tayari-python-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: python-ai
          image: ghcr.io/job-tayari/tayari-python-ai:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tayari-runtime-config
            - secretRef:
                name: tayari-runtime-secrets
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 40
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-cache
              mountPath: /home/app/.cache
            - name: uploads
              mountPath: /uploads
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-cache
          emptyDir: {}
        - name: uploads
          emptyDir: {}
