apiVersion: apps/v1
kind: Deployment
metadata:
  name: tayari-celery-beat
  labels:
    app.kubernetes.io/name: celery-beat
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: job-tayari
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-beat
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/part-of: job-tayari
    spec:
      serviceAccountName: tayari-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery-beat
          image: ghcr.io/job-tayari/tayari-worker:replace-me
          imagePullPolicy: IfNotPresent
          args:
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: tayari-runtime-config
            - secretRef:
                name: tayari-runtime-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: celery-schedule
              mountPath: /home/app
      volumes:
        - name: tmp
          emptyDir: {}
        - name: celery-schedule
          emptyDir: {}
