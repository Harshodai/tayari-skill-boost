apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tayari-frontend
  labels:
    app.kubernetes.io/part-of: job-tayari
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tayari-frontend
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
