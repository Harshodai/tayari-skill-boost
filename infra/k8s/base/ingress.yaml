apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tayari-public
  labels:
    app.kubernetes.io/part-of: job-tayari
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - job-tayari.example.invalid
      secretName: tayari-public-tls
  rules:
    - host: job-tayari.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tayari-go-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tayari-frontend
                port:
                  name: http
