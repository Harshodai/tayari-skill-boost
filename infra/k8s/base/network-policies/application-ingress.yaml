apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-from-ingress
  labels:
    app.kubernetes.io/part-of: job-tayari
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-from-frontend-and-ingress
  labels:
    app.kubernetes.io/part-of: job-tayari
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: go-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-python-api-from-gateway-and-workers
  labels:
    app.kubernetes.io/part-of: job-tayari
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: python-ai
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["go-gateway", "worker", "celery-beat"]
      ports:
        - protocol: TCP
          port: 8000
