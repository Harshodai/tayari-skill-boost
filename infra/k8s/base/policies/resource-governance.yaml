apiVersion: v1
kind: ResourceQuota
metadata:
  name: tayari-workload-budget
  labels:
    app.kubernetes.io/part-of: job-tayari
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.cpu: "16"
    limits.memory: 24Gi
    pods: "24"
    services: "12"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tayari-default-limits
  labels:
    app.kubernetes.io/part-of: job-tayari
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
