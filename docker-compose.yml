version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tayari
      POSTGRES_PASSWORD: tayari_dev
      POSTGRES_DB: tayari
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tayari"]
      interval: 5s
      timeout: 5s
      retries: 5

  python-ai:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=8000
      # Hermes + Celery/Redis layer (WS-C). Lets FastAPI enqueue Celery tasks
      # and read agent_runs/scraped_jobs from Postgres.
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://tayari:tayari_dev@postgres:5432/tayari?sslmode=disable
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - CRAWL4AI_BASE_URL=${CRAWL4AI_BASE_URL:-}
      - HERMES_AGENT_URL=${HERMES_AGENT_URL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-hermes3:8b}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend/python
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://tayari:tayari_dev@postgres:5432/tayari?sslmode=disable
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - CRAWL4AI_BASE_URL=${CRAWL4AI_BASE_URL:-}
      - HERMES_AGENT_URL=${HERMES_AGENT_URL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-hermes3:8b}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  celery-flower:
    # Build from the worker context so the image has the app package + deps.
    # The mher/flower image lacks `app` and can't import app.celery_app.
    build:
      context: ./backend/python
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "app.celery_app:celery_app", "flower", "--port=5555", "--url-prefix=flower"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://tayari:tayari_dev@postgres:5432/tayari?sslmode=disable
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - CRAWL4AI_BASE_URL=${CRAWL4AI_BASE_URL:-}
      - HERMES_AGENT_URL=${HERMES_AGENT_URL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-hermes3:8b}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    ports:
      - "5555:5555"
    depends_on:
      celery-worker:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-backend:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://tayari:tayari_dev@postgres:5432/tayari?sslmode=disable
      - AI_SERVICE_URL=http://python-ai:8000
      - JWT_SECRET=${JWT_SECRET:-tayari-dev-secret-change-me}
      - PORT=8080
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      python-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: tayari-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
        - VITE_USE_SELF_HOSTED=${VITE_USE_SELF_HOSTED}
        - VITE_SUPABASE_PROJECT_ID=${VITE_SUPABASE_PROJECT_ID}
    ports:
      - "8083:80"
    depends_on:
      - go-backend

volumes:
  postgres_data:
  ollama_data:
  redis_data:

