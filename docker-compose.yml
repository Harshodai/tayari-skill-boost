version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tayari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tayari_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tayari}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tayari"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod", "eval"]

  python-ai:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PORT=8000
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-tayari}:${POSTGRES_PASSWORD:-tayari_dev}@postgres:5432/${POSTGRES_DB:-tayari}?sslmode=disable
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - CRAWL4AI_BASE_URL=${CRAWL4AI_BASE_URL:-}
      - HERMES_AGENT_URL=${HERMES_AGENT_URL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-hermes3:8b}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
    volumes:
      - ./backend/python:/app
    ports:
      - "8002:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod", "eval"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod"]

  celery-worker:
    build:
      context: ./backend/python
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-tayari}:${POSTGRES_PASSWORD:-tayari_dev}@postgres:5432/${POSTGRES_DB:-tayari}?sslmode=disable
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - CRAWL4AI_BASE_URL=${CRAWL4AI_BASE_URL:-}
      - HERMES_AGENT_URL=${HERMES_AGENT_URL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-hermes3:8b}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["dev", "prod"]

  celery-flower:
    build:
      context: ./backend/python
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "app.celery_app:celery_app", "flower", "--port=5555", "--url-prefix=flower"]
    environment:
      - FLOWER_UNAUTHENTICATED_API=true
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-tayari}:${POSTGRES_PASSWORD:-tayari_dev}@postgres:5432/${POSTGRES_DB:-tayari}?sslmode=disable
    ports:
      - "5555:5555"
    depends_on:
      celery-worker:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5555/flower\")' || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["dev", "prod"]

  go-backend:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-tayari}:${POSTGRES_PASSWORD:-tayari_dev}@postgres:5432/${POSTGRES_DB:-tayari}?sslmode=disable
      - AI_SERVICE_URL=http://python-ai:8000
      - USE_SUPABASE=${USE_SUPABASE:-false}
      - JWT_SECRET=${JWT_SECRET:-tayari-dev-secret-change-me}
      - PORT=8080
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8083}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8083}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - APP_VERSION=${APP_VERSION:-0.1.0}
    ports:
      - "8085:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      python-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod", "eval"]

  ollama:
    image: ollama/ollama:0.1.39
    container_name: tayari-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || curl -f http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["dev", "prod"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
        - VITE_USE_SELF_HOSTED=${VITE_USE_SELF_HOSTED}
        - VITE_SUPABASE_PROJECT_ID=${VITE_SUPABASE_PROJECT_ID}
        - VITE_SENTRY_DSN=${SENTRY_DSN:-}
        - VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT:-development}
    ports:
      - "8083:80"
    restart: unless-stopped
    depends_on:
      - go-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: ["dev", "prod"]

  caddy:
    image: caddy:2.7.6-alpine
    ports:
      - "${CADDY_HTTP_PORT:-8090}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@tayari.app}
    depends_on:
      - frontend
      - go-backend
      - celery-flower
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "caddy version || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["dev", "prod"]

  celery-beat:
    build:
      context: ./backend/python
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-tayari}:${POSTGRES_PASSWORD:-tayari_dev}@postgres:5432/${POSTGRES_DB:-tayari}?sslmode=disable
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app status || exit 0"]
      interval: 20s
      timeout: 10s
      retries: 3
    profiles: ["dev", "prod"]

volumes:
  postgres_data:
  ollama_data:
  redis_data:
  caddy_data:
  caddy_config:
