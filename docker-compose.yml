# Database is the self-hosted Supabase stack in supabase-local/ (db, kong,
# auth/GoTrue, rest/PostgREST, realtime, storage, meta, studio, supavisor) --
# not a bare Postgres image. `include:` merges it into this project so one
# `docker compose --profile dev up` still brings up everything; its services
# have no `profiles:` of their own, so they're always active regardless of
# which profile is selected here.
#
# POSTGRES_PASSWORD and JWT_SECRET below MUST be identical to the values in
# supabase-local/.env -- Compose resolves each file's ${VAR} against its own
# env file, so these are two separate values that only end up equal if you
# set them to match. GoTrue signs tokens with supabase-local's JWT_SECRET;
# go-backend verifies them with this file's JWT_SECRET (see
# internal/auth/supabase.go VerifyToken) -- a mismatch means every login
# looks like an invalid token, not an obvious "wrong secret" error.
# JWT_SECRET deliberately has NO default: a baked-in default would silently
# pair with supabase-local's different default and 401 every login with no
# distinguishing error. Leave it unset and go-backend fatals fast with a
# clear message instead.
include:
  - path: supabase-local/docker-compose.yml
    env_file: supabase-local/.env

services:
  python-ai:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PORT=8000
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - CRAWL4AI_BASE_URL=${CRAWL4AI_BASE_URL:-}
      - HERMES_AGENT_URL=${HERMES_AGENT_URL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-hermes3:8b}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - JWT_SECRET=${JWT_SECRET}
      # Defaults preserve the historical dev behavior (single-process, live
      # reload) for anyone not setting these. Set UVICORN_RELOAD=false in a
      # prod .env — --reload has no benefit outside local dev and silently
      # caps the whole service at one worker process.
      - UVICORN_RELOAD=${UVICORN_RELOAD:-true}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
    volumes:
      - ./backend/python:/app
    ports:
      - "${PYTHON_AI_PORT:-8002}:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod", "eval"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod"]

  celery-worker:
    build:
      context: ./backend/python
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY:-}
      - CRAWL4AI_BASE_URL=${CRAWL4AI_BASE_URL:-}
      - HERMES_AGENT_URL=${HERMES_AGENT_URL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-hermes3:8b}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping"]
      interval: 15s
      timeout: 12s
      retries: 3
    profiles: ["dev", "prod"]

  celery-flower:
    build:
      context: ./backend/python
      dockerfile: Dockerfile.worker
    # WARNING: Never expose port 5555 publicly in production.
    # Flower is dev-only — use 'docker compose --profile dev up' to start it.
    # Credentials are checked at container startup (not via Compose ${VAR:?}
    # interpolation) — that interpolation runs for every service in the file
    # regardless of active profile, so it would break `--profile prod up`
    # even though prod never starts this service. Failing inside the
    # container instead means only starting celery-flower without both vars
    # set fails closed.
    command: >
      sh -c '
        if [ -z "$$FLOWER_USER" ] || [ -z "$$FLOWER_PASSWORD" ]; then
          echo "FLOWER_USER and FLOWER_PASSWORD must both be set in .env — refusing to start Flower without dashboard auth." >&2;
          exit 1;
        fi;
        exec celery -A app.celery_app:celery_app flower --port=5555 --url-prefix=flower
      '
    environment:
      # Disable unauthenticated API — require basic auth credentials.
      # Set FLOWER_USER and FLOWER_PASSWORD in .env (never commit them).
      - FLOWER_UNAUTHENTICATED_API=false
      - FLOWER_USER=${FLOWER_USER:-}
      - FLOWER_PASSWORD=${FLOWER_PASSWORD:-}
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-}:${FLOWER_PASSWORD:-}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
    ports:
      # Bind to localhost only — do not expose on 0.0.0.0 in production.
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"
    depends_on:
      celery-worker:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["dev"]  # dev ONLY — removed 'prod' to prevent accidental exposure
    healthcheck:
      # Flower requires basic auth (FLOWER_UNAUTHENTICATED_API=false) and is
      # served under /flower/ (trailing slash — --url-prefix=flower without
      # it 404s), so a bare unauthenticated request can never succeed.
      test: ["CMD-SHELL", "python -c \"import os, base64, urllib.request; req = urllib.request.Request('http://localhost:5555/flower/'); req.add_header('Authorization', 'Basic ' + base64.b64encode((os.environ['FLOWER_USER'] + ':' + os.environ['FLOWER_PASSWORD']).encode()).decode()); urllib.request.urlopen(req, timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 3

  go-backend:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
      - AI_SERVICE_URL=http://python-ai:8000
      - USE_SUPABASE=${USE_SUPABASE:-true}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL:-http://kong:8000}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      # Optional — enables GoTrue Admin-API account deletion + session
      # revocation (DELETE /api/v1/account). Copy SERVICE_ROLE_KEY from
      # supabase-local/.env; without it, the direct SQL delete is used.
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - PORT=8080
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8083}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8083}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - APP_VERSION=${APP_VERSION:-0.1.0}
    ports:
      - "${GO_BACKEND_PORT:-8085}:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      python-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["dev", "prod", "eval"]

  ollama:
    image: ollama/ollama:0.32.5
    container_name: tayari-ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || curl -f http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["dev", "prod"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
        - VITE_USE_SELF_HOSTED=${VITE_USE_SELF_HOSTED}
        - VITE_SUPABASE_PROJECT_ID=${VITE_SUPABASE_PROJECT_ID}
        - VITE_SENTRY_DSN=${SENTRY_DSN:-}
        - VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT:-development}
    ports:
      - "${FRONTEND_PORT:-8083}:80"
    restart: unless-stopped
    depends_on:
      - go-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: ["dev", "prod"]

  caddy:
    image: caddy:2.7.6-alpine
    ports:
      - "${CADDY_HTTP_PORT:-8090}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@tayari.app}
    depends_on:
      - frontend
      - go-backend
      # celery-flower is dev-only (profiles: ["dev"]) — depending on it here
      # breaks `--profile prod up`, since Compose rejects a depends_on target
      # that isn't part of the active profile set. The Caddyfile's
      # `/flower/*` reverse_proxy route is unaffected: with no depends_on
      # ordering, Caddy just 502s that path until Flower is up, same as any
      # other race with a slow-starting upstream.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "caddy version || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["dev", "prod"]

  celery-beat:
    build:
      context: ./backend/python
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app status || exit 0"]
      interval: 20s
      timeout: 10s
      retries: 3
    profiles: ["dev", "prod"]

volumes:
  ollama_data:
  redis_data:
  caddy_data:
  caddy_config:
